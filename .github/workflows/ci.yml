name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        java: [21, 25]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: "Set up JDK ${{ matrix.java }}"
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      - name: "Build and test"
        run: mvn -B verify

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: "Set up JDK 21"
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: "Spotless format check"
        run: mvn -B spotless:check

      - name: "SpotBugs static analysis"
        run: mvn -B -DskipTests package spotbugs:check

  smoke:
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - name: "Set up JDK 21"
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: "Build shaded JAR"
        run: mvn -B -DskipTests package

      - name: "Run against a compatible Avro history (expect exit 0)"
        run: |
          java -jar target/schemaevo.jar check --format avro --mode BACKWARD_TRANSITIVE \
            --history examples/avro/orders-compatible

      - name: "Run against a breaking Avro history (expect exit 1)"
        run: |
          set +e
          java -jar target/schemaevo.jar check --format avro --mode BACKWARD_TRANSITIVE \
            --history examples/avro/orders-breaking
          code=$?
          set -e
          if [ "$code" -ne 1 ]; then
            echo "expected exit code 1, got $code" >&2
            exit 1
          fi

      - name: "Run against a compatible JSON Schema history (expect exit 0)"
        run: |
          java -jar target/schemaevo.jar check --format json-schema --mode FULL_TRANSITIVE \
            --history examples/jsonschema/user-compatible

      - name: "Run against a breaking JSON Schema history (expect exit 1)"
        run: |
          set +e
          java -jar target/schemaevo.jar check --format json-schema --mode BACKWARD_TRANSITIVE \
            --history examples/jsonschema/user-breaking
          code=$?
          set -e
          if [ "$code" -ne 1 ]; then
            echo "expected exit code 1, got $code" >&2
            exit 1
          fi
